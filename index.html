<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007782">
<title>Generador de anuncios Vinted</title>
<style>
:root{--bg:#f6f7f7;--card:#fff;--tx:#1c2a2b;--mut:#66787a;--line:#dfe5e5;--acc:#007782;--acc2:#e6f4f5;--onacc:#fff;--err:#b3261e;--warn:#8a5a00;--warnbg:#fff4dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111717;--card:#192121;--tx:#e8f0f0;--mut:#93a6a8;--line:#2b3838;--acc:#35b8c4;--acc2:#16343a;--onacc:#06191c;--err:#ff8a80;--warn:#ffd58a;--warnbg:#3a2e14}}
:root[data-theme="dark"]{--bg:#111717;--card:#192121;--tx:#e8f0f0;--mut:#93a6a8;--line:#2b3838;--acc:#35b8c4;--acc2:#16343a;--onacc:#06191c;--err:#ff8a80;--warn:#ffd58a;--warnbg:#3a2e14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:800px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:1.45rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:560px){.row,.row3{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
.drop:hover{border-color:var(--acc)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;padding:0;line-height:20px;background:var(--tx);color:var(--bg);border:0;cursor:pointer}
button{font-family:inherit}
button.main{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font-weight:600;font-size:1rem;cursor:pointer}
button.main:disabled,button.sec:disabled{opacity:.6;cursor:wait}
button.sec,button.copy,.lang button{border:1px solid var(--acc);background:var(--acc2);color:var(--acc);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}
button.copy.ok,.lang button.on{background:var(--acc);color:var(--onacc)}
.lang{display:flex;gap:6px;flex-shrink:0}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.cnt{display:block;font-size:.75rem;color:var(--mut)}
h2{font-size:1rem;margin:0 0 6px}
pre{white-space:pre-wrap;font:inherit;margin:8px 0 12px;padding:12px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.tags span{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0;font-size:.85rem}
.err{color:var(--err);margin-top:12px}
.warn{color:var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 12px;margin-top:12px;font-size:.9rem}
.tip{color:var(--mut);font-size:.9rem;margin:4px 0}
.hide{display:none!important}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
details summary{cursor:pointer;font-weight:600}
.hist{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:.8rem;color:var(--mut);margin:6px 0 0}
.note code{font-size:.8rem;background:var(--bg);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#status{font-size:.85rem;color:var(--mut);margin:6px 0 0;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:.75rem;background:var(--acc2);color:var(--acc);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<main>
<div class="top">
  <div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="lang"><button id="bes">ES</button><button id="ben">EN</button></div>
</div>

<!-- Motor de IA -->
<div class="card">
  <h2 id="h_engine"></h2>
  <select id="engine">
    <option value="webllm"></option>
    <option value="ollama"></option>
    <option value="openai"></option>
    <option value="tpl"></option>
  </select>

  <div id="p_webllm">
    <label for="wlmodel" id="l_wlmodel"></label>
    <select id="wlmodel">
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC"></option>
      <option value="Qwen2.5-3B-Instruct-q4f16_1-MLC"></option>
      <option value="Qwen2.5-7B-Instruct-q4f16_1-MLC"></option>
      <option value="Phi-3.5-vision-instruct-q4f16_1-MLC"></option>
    </select>
    <div class="acts"><button class="sec" id="wlload"></button></div>
    <div class="bar hide" id="bar"><i id="barfill"></i></div>
    <p class="note" id="n_webllm"></p>
  </div>

  <div id="p_ollama" class="hide">
    <div class="row">
      <div><label for="olurl" id="l_olurl"></label><input id="olurl" value="http://localhost:11434/v1"></div>
      <div><label for="olmodel" id="l_olmodel"></label><input id="olmodel" value="gemma3:4b"></div>
    </div>
    <p class="note" id="n_ollama"></p>
  </div>

  <div id="p_openai" class="hide">
    <label for="oaurl" id="l_oaurl"></label><input id="oaurl" placeholder="https://api.groq.com/openai/v1">
    <div class="row">
      <div><label for="oakey" id="l_oakey"></label><input id="oakey" type="password" autocomplete="off"></div>
      <div><label for="oamodel" id="l_oamodel"></label><input id="oamodel" placeholder="meta-llama/llama-4-scout-17b-16e-instruct"></div>
    </div>
    <p class="note" id="n_openai"></p>
  </div>

  <p class="note hide" id="n_tpl"></p>
  <p id="status"></p>
</div>

<div class="card">
  <div class="drop" id="drop"></div>
  <input type="file" id="file" accept="image/*" multiple class="hide">
  <div class="thumbs" id="thumbs"></div>

  <label for="title" id="l_title"></label><input id="title">
  <div class="row3">
    <div><label for="brand" id="l_brand"></label><input id="brand"></div>
    <div><label for="size" id="l_size"></label><input id="size"></div>
    <div><label for="color" id="l_color"></label><input id="color"></div>
  </div>
  <div class="row3">
    <div><label for="material" id="l_material"></label><input id="material"></div>
    <div><label for="meas" id="l_meas"></label><input id="meas"></div>
    <div><label for="price" id="l_price"></label><input id="price" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div><label for="cond" id="l_cond"></label><select id="cond"></select></div>
    <div><label for="gender" id="l_gender"></label><select id="gender"></select></div>
  </div>
  <div class="row3">
    <div><label for="lang" id="l_lang"></label>
      <select id="lang"><option value="Spanish">Español</option><option value="English">English</option><option value="French">Français</option><option value="Italian">Italiano</option><option value="German">Deutsch</option><option value="Portuguese">Português</option></select></div>
    <div><label for="tone" id="l_tone"></label><select id="tone"></select></div>
    <div><label for="len" id="l_len"></label><select id="len"></select></div>
  </div>
  <label for="notes" id="l_notes"></label><textarea id="notes"></textarea>

  <button class="main" id="go"></button>
  <div class="err hide" id="err"></div>
  <div class="warn hide" id="warn"></div>
</div>

<div id="out" class="hide">
  <div class="card"><h2 id="h_titles"></h2><div id="titles"></div></div>
  <div class="card"><h2 id="h_desc"></h2><pre id="desc"></pre>
    <div class="acts"><button class="copy" id="cdesc"></button><button class="sec" id="regen"></button><button class="sec" id="short"></button></div></div>
  <div class="card"><h2 id="h_tags"></h2><div class="tags" id="tags"></div><div class="acts"><button class="copy" id="ctags"></button></div>
    <h2 id="h_kw" style="margin-top:14px"></h2><div id="kw"></div></div>
  <div class="card"><h2 id="h_form"></h2><div id="extras"></div></div>
  <div class="card"><h2 id="h_msgs"></h2><div id="msgs"></div></div>
  <div class="card"><h2 id="h_tips"></h2><div id="tips"></div></div>
  <div class="acts"><button class="main" id="call" style="flex:1"></button><button class="sec" id="dl"></button></div>
</div>

<div class="card" style="margin-top:16px">
  <h2 id="h_hist"></h2><div id="hist"></div>
  <div class="acts"><button class="sec" id="clr"></button></div>
</div>
</main>

/* fotos */
function shrink(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var s=Math.min(1,1024/Math.max(im.width,im.height));
      var c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res({url:c.toDataURL("image/jpeg",.85)})};
      im.onerror=rej;im.src=r.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

    d.appendChild(im);d.appendChild(b);el.appendChild(d);

}

function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function clean(s){return cap(s.replace(/\s+/g," ").replace(/\s+,/g,",").replace(/^[\s,·-]+|[\s,·-]+$/g,"").trim())}
function has(hay,needle){return needle&&hay.toLowerCase().indexOf(needle.toLowerCase())>=0}
function noEmoji(s){return s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]️?\s?/gu,"").trim()}

function money(price){
  var m=(price||"").replace(",",".").match(/\d+(\.\d+)?/);if(!m)return null;
  var n=parseFloat(m[0]),sym=/£/.test(price)?"£":/\$/.test(price)?"$":/zł|pln/i.test(price)?"zł":/kč|czk/i.test(price)?"Kč":"€";
  var f=function(x){var r=x>=10?Math.round(x):Math.round(x*2)/2;r=String(r).replace(".",",");return (sym==="£"||sym==="$")?sym+r:r+" "+sym};
  return {suggested:f(n),quick_sale:f(n*.85),minimum:f(n*.75)};
}

function templateListing(f,opt){
  var p=P[f.lc],S=SELLER[L],plain=f.tone===1||f.tone===3;
  var item=f.title||p.item;
  var brand=has(item,f.brand)?"":f.brand;
  var cond=f.cond>=0?p.conds[f.cond]:"",gend=f.gender>=0?p.gend[f.gender]:"";
  var sz=f.size?p.lb.size+" "+f.size:"";
  var titles=[
    clean([brand,item,f.color,sz].join(" ")),
    clean([item,brand,f.material,f.color].join(" ")+(cond?" - "+cond:"")),
    clean([brand,item,gend,f.size?f.size:"",f.color&&!f.size?f.color:""].join(" "))
  ].map(function(x){return x.slice(0,100)});
  titles=titles.filter(function(x,i){return titles.indexOf(x)===i});
  for(var k=0;k<(opt.variant||0)%titles.length;k++)titles.push(titles.shift());

  var short=opt.short||f.len===1,detailed=!opt.short&&f.len===2;
  var lines=[];
  lines.push((plain?"":"✨ ")+cap(item)+(brand?" "+p.of+" "+brand:"")+". "+p.hooks[f.tone]);
  var det=[[p.lb.brand,f.brand],[p.lb.size,f.size],[p.lb.color,f.color],[p.lb.material,f.material],[p.lb.meas,f.meas],[p.lb.cond,cond],[p.lb["for"],gend]]
    .filter(function(x){return x[1]}).map(function(x){return "• "+x[0]+": "+x[1]});
  if(det.length){lines.push("");if(!short)lines.push(p.det);lines=lines.concat(det)}
  if(f.notes){lines.push("");lines.push(f.notes)}
  lines.push("");
  if(detailed)lines.push(p.photos);
  lines.push(p.ship);lines.push(p.offer);
  if(!short)lines.push(p.bundle);
  var desc=lines.join("\n");if(plain)desc=desc.split("\n").map(noEmoji).join("\n");

  var catHit=null;CATS.some(function(c){if(c[0].test(f.title+" "+f.notes)){catHit=c;return true}});
  var category=catHit?((f.gender>=0?T[L].genders[f.gender]+" › ":"")+(L==="es"?catHit[1]:catHit[2])):"";

  var words=(f.title+" "+f.brand+" "+f.color+" "+f.material).split(/[\s,./+-]+/).filter(function(w){return w.length>2&&!p.stop.test(w)});
  var tags=[];
  if(f.brand)tags.push("#"+f.brand);
  words.forEach(function(w){tags.push("#"+w)});
  tags=tags.concat(p.tags).map(function(h){return "#"+h.replace(/^#/,"").toLowerCase().replace(/[^\p{L}\p{N}]/gu,"")})
    .filter(function(h,i,a){return h.length>2&&a.indexOf(h)===i}).slice(0,8);

  var base=f.title||p.item,kw=[];
  [base,f.brand&&!has(base,f.brand)?f.brand+" "+base:"",f.color?base+" "+f.color:"",f.size?base+" "+f.size:"",gend?base+" "+gend:"",f.material?base+" "+f.material:"",f.brand].concat(words)
    .forEach(function(x){x=(x||"").toLowerCase().trim();if(x&&kw.indexOf(x)<0)kw.push(x)});

  var mon=money(f.price)||{};
  var msg=p.msg;
  return {titles:titles,description:desc,hashtags:tags,keywords:kw.slice(0,12),category:category,condition:cond,
    pricing:{suggested:mon.suggested||"",quick_sale:mon.quick_sale||"",minimum:mon.minimum||""},shipping_note:S.ship,
    messages:{available:msg.av,low_offer:mon.minimum?msg.lowMin.replace("{min}",mon.minimum):msg.low,thanks:msg.thanks,bundle:msg.bundle},
    tips:S.tips,photo_tips:S.photos};
}

    condition:f.cond>=0?P[f.lc].conds[f.cond]:"",for:f.gender>=0?P[f.lc].gend[f.gender]:"",seller_price:f.price,notes:f.notes};
  var shape='{"titles":["","",""],"description":"","hashtags":["#"],"keywords":[""],"category":"","condition":"","pricing":{"suggested":"","quick_sale":"","minimum":""}'+
    (full?',"messages":{"available":"","low_offer":"","thanks":"","bundle":""}':"")+"}";
  return "You are an expert Vinted seller and copywriter. Write a listing that sells fast and ranks well in Vinted search.\n"+
  "Write ALL text in "+f.langName+". Tone: "+T.en.tones[f.tone]+". Description length: "+T.en.lens[f.len]+".\n"+
  "Item data (empty = unknown): "+JSON.stringify(d)+"\n"+
  (withImgs?"Look at the photo(s): identify item type, visible brand, colour, material, style, condition and visible flaws.\n":"")+
  "Rules: never invent brand, size, measurements or flaws that are not given or visible; omit unknowns. 3 different titles, max 80 characters each: brand + item + colour/size + strongest search keyword, no ALL CAPS. "+
  "Description: a hook line, then a details list with one detail per line, flaws only if given, then invite offers and promise fast careful shipping; at most 3 emojis. "+
  "6-8 hashtags, 8-12 search keywords, a suggested Vinted category path, the Vinted condition. Pricing in the seller's currency (euros if none), only if a price is given or the item is clearly identifiable; otherwise empty strings."+
  (full?" Messages: short, polite, ready to send (reply to 'is it still available', polite counter to a very low offer, thank-you after sale, bundle discount offer).":"")+"\n"+
  (extra?extra+"\n":"")+
  "Reply ONLY with valid JSON, no backticks, exactly this shape: "+shape;
}

function parseJSON(txt){
  var s=(txt||"").replace(/```json|```/g,"").replace(/<think>[\s\S]*?<\/think>/g,"").trim();
  var a=s.indexOf("{"),b=s.lastIndexOf("}");if(a<0||b<a)throw new Error("json");
  s=s.slice(a,b+1);
  try{return JSON.parse(s)}catch(e){return JSON.parse(s.replace(/,\s*([}\]])/g,"$1").replace(/[“”]/g,'"'))}
}
function strs(a,n){return Array.isArray(a)?a.filter(function(x){return typeof x==="string"&&x.trim()}).map(function(x){return x.trim()}).slice(0,n):[]}
function merge(base,ai){
  var r=JSON.parse(JSON.stringify(base));
  var ti=strs(ai.titles,3).map(function(x){return x.slice(0,100)});if(ti.length)r.titles=ti;
  if(typeof ai.description==="string"&&ai.description.trim().length>30)r.description=ai.description.replace(/\\n/g,"\n").trim();
  var h=strs(ai.hashtags,8).map(function(x){return "#"+x.replace(/^#+/,"").replace(/\s+/g,"").toLowerCase()}).filter(function(x){return x.length>2});if(h.length>=3)r.hashtags=h;
  var k=strs(ai.keywords,12);if(k.length>=3)r.keywords=k;
  if(typeof ai.category==="string"&&ai.category.trim())r.category=ai.category.trim();
  if(typeof ai.condition==="string"&&ai.condition.trim())r.condition=ai.condition.trim();
  var ap=ai.pricing||{};["suggested","quick_sale","minimum"].forEach(function(x){if(!r.pricing[x]&&ap[x]&&String(ap[x]).trim())r.pricing[x]=String(ap[x]).trim()});
  var am=ai.messages||{};["available","low_offer","thanks","bundle"].forEach(function(x){if(typeof am[x]==="string"&&am[x].trim().length>10)r.messages[x]=am[x].trim()});
  if(!ti.length)throw Object.assign(new Error("gen"),{code:"gen"});
  return r;
}
function err(code,msg){var e=new Error(msg||code);e.code=code;return e}

/* WebLLM: IA local en el navegador (github.com/mlc-ai/web-llm) */
var WL=null,engine=null,engineId="",f16=null;
function curModelBase(){var b=$("wlmodel").value;return f16===false?b.replace("q4f16_1","q4f32_1"):b}
async function loadWebLLM(){
  if(!navigator.gpu)throw err("nogpu");
  if(f16===null){try{var ad=await navigator.gpu.requestAdapter();if(!ad)throw err("nogpu");f16=ad.features.has("shader-f16")}catch(e){if(e.code)throw e;f16=false}}
  var id=curModelBase();
  if(engine&&engineId===id)return engine;
  setStatus(t("loading"));setBar(0);
  if(!WL)WL=await import(WEBLLM_URL);
  var cb=function(p){setBar(p.progress);setStatus(p.text)};
  try{
    if(engine){engine.setInitProgressCallback(cb);await engine.reload(id)}
    else engine=await WL.CreateMLCEngine(id,{initProgressCallback:cb});
  }catch(e){engine=null;engineId="";$("bar").classList.add("hide");throw err("model",String(e&&e.message||e))}
  engineId=id;setBar(1);setStatus(t("ready"));
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  return engine;
}
async function askWebLLM(f,extra){
  var e=await loadWebLLM(),vision=/vision/i.test(engineId),useImg=vision&&imgs.length>0;
  var prompt=buildPrompt(f,extra,useImg,false);
  var msgs=useImg?[{role:"user",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:imgs[0].url}}]}]
    :[{role:"system",content:"You are a helpful assistant that only answers with valid JSON."},{role:"user",content:prompt}];
  var run=async function(json){
    var req={messages:msgs,temperature:.7,max_tokens:1100,stream:true};
    if(json)req.response_format={type:"json_object"};
    var out="",n=0,chunks=await e.chat.completions.create(req);
    for await(var c of chunks){out+=(c.choices[0]&&c.choices[0].delta&&c.choices[0].delta.content)||"";if(++n%8===0)setStatus(t("writing")+out.length+" "+t("chars"))}
    return out;
  };
  var txt;
  try{txt=await run(!vision)}catch(x){txt=await run(false)}
  try{await e.resetChat()}catch(x){}
  setStatus(t("ready"));
  return {text:txt,sawImgs:useImg};
}

/* Ollama / servidores compatibles con OpenAI */
async function askOpenAI(base,key,model,f,extra){
  if(!base||!model)throw err("nourl");
  var url=base.replace(/\/+$/,"")+"/chat/completions";
  var call=async function(withImgs,json){
    var prompt=buildPrompt(f,extra,withImgs,true);
    var content=withImgs?[{type:"text",text:prompt}].concat(imgs.map(function(x){return {type:"image_url",image_url:{url:x.url}}})):prompt;
    var body={model:model,messages:[{role:"user",content:content}],temperature:.7,stream:false};
    if(json)body.response_format={type:"json_object"};
    var h={"content-type":"application/json"};if(key)h.authorization="Bearer "+key;
    var r;
    try{r=await fetch(url,{method:"POST",headers:h,body:JSON.stringify(body)})}catch(x){throw err("conn")}
    if(r.status===401||r.status===403)throw err("auth");
    if(r.status===429)throw err("rate");
    if(!r.ok){var tx="";try{tx=await r.text()}catch(x){}throw err("http",r.status+" "+tx.slice(0,200))}
    var d=await r.json();
    return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
  };
  var withImgs=imgs.length>0,dropped=false,txt;
  try{txt=await call(withImgs,true)}
  catch(e){
    if(e.code!=="http")throw e;
    try{txt=await call(withImgs,false)}
    catch(e2){if(e2.code!=="http"||!withImgs)throw e2;txt=await call(false,false);withImgs=false;dropped=true}
  }
  return {text:txt,sawImgs:withImgs,dropped:dropped};
}

function errText(e){
  var c=e&&e.code;
  return c==="nogpu"?t("nogpu"):c==="conn"?t("e_conn"):c==="auth"?t("e_auth"):c==="rate"?t("e_rate"):c==="nourl"?t("e_nourl"):
    c==="model"?t("e_model")+e.message:c==="http"?t("e_gen")+" ("+e.message+")":t("e_gen");
}

async function generate(extra,opt){
  showErr("");showWarn([]);
  var f=form();
  if(!imgs.length&&!f.title){showErr(t("need"));return}
  var btns=[$("go"),$("regen"),$("short")];btns.forEach(function(b){b.disabled=true});$("go").textContent=t("wait");
  var eng=$("engine").value,warns=[],r;
  var base=templateListing(f,opt||{});
  try{
    if(eng==="tpl"){
      r=base;
      if(imgs.length)warns.push(f.title?t("noseeimg"):t("needtitle"));
    }else{
      var res;
      try{
        res=eng==="webllm"?await askWebLLM(f,extra):
          eng==="ollama"?await askOpenAI($("olurl").value.trim(),"",$("olmodel").value.trim(),f,extra):
          await askOpenAI($("oaurl").value.trim(),$("oakey").value.trim(),$("oamodel").value.trim(),f,extra);
        r=merge(base,parseJSON(res.text));
        if(res.dropped)warns.push(t("imgdrop"));
        else if(imgs.length&&!res.sawImgs)warns.push(f.title?t("noseeimg"):t("needtitle"));
      }catch(e){
        r=base;warns.push(errText(e)+" "+t("fallback"));
        if(imgs.length&&!f.title)warns.push(t("needtitle"));
      }
    }
    render(r);saveHist(r);showWarn(warns);
    $("out").scrollIntoView({behavior:"smooth"});
  }catch(e){showErr(t("e_gen"))}
  finally{btns.forEach(function(b){b.disabled=false});$("go").textContent=t("go")}
}
$("go").onclick=function(){variant=0;generate("",{})};
$("regen").onclick=function(){variant++;generate("Give fresh alternatives; do not repeat previous wording.",{variant:variant})};
$("short").onclick=function(){generate("Make the description noticeably shorter and punchier (under 450 characters).",{short:true,variant:variant})};
$("wlload").onclick=async function(){var b=this;b.disabled=true;showErr("");try{await loadWebLLM()}catch(e){showErr(errText(e))}finally{b.disabled=false}};

applyLang();
showEngine();
})();
</script>
